# 운영 위치: beta (172.26.4.90). 소스와 빌드는 alpha에서, 배포는 alpha에서 `deploy flowguide`.
# beta에만 있는 실행 데이터(DB 파일, 비밀 파일 등)는 같은 경로에 그대로 두고 배포가 건드리지 않는다.
# ============================================================
# n9n docker-compose.yml
#
# 서비스 구성:
#   postgres  — chatbot 인증 DB
#   backend   — FastAPI RAG 추론 서버 (포트 8000)
#   chatbot   — Next.js 프론트엔드 (포트 3000)
#
# n8n(워크플로우 자동화)은 ~/projects/n8n/ 로 분리됨 — 여기와 무관
#
# 사용법:
#   cp .env.example .env  →  값 입력  →  make up
# ============================================================

name: naito

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: n9n-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n9n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n9n} -d ${POSTGRES_DB:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI 백엔드 ─────────────────────────────────────────
  backend:
    build:
      context: .                  # 프로젝트 루트 (query_engine.py 포함)
      dockerfile: server/Dockerfile
    image: cortie/naito-backend:latest
    container_name: n9n-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "172.26.4.90:8000:8000"   # gate 전용 (사설망)
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      RERANKER_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
    volumes:
      # RAG 데이터 마운트 (대용량 파일 이미지 미포함). ChromaDB가 sqlite 파일에
      # 쓰기 잠금을 걸기 때문에 :ro로 마운트하면 벡터 검색이 BM25로 축소됨
      - ./RAG_dataset:/app/RAG_dataset
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama 별도 서버 접근용
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s           # RAG 인덱스 로드 시간 확보

  # ── Next.js 프론트엔드 ─────────────────────────────────────
  chatbot:
    build:
      context: chatbot
      dockerfile: Dockerfile
    image: cortie/naito-chatbot:latest
    container_name: n9n-chatbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
      - "172.26.4.90:3010:3000"   # gate 전용 (사설망)
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://n9n:changeme@postgres:5432/chatbot}
      AUTH_SECRET: ${AUTH_SECRET}
      N9N_API: ${N9N_API:-http://backend:8000}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data: